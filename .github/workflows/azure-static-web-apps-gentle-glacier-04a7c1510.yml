name: Azure Static Web Apps CI/CD

on:
  # Permite lanzar el despliegue a mano desde la pestaña Actions, sin tener que
  # inventar un commit solo para eso.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # El proyecto se compila aquí y no con el constructor automático de Azure:
      # así la versión de Node es la misma que en desarrollo y, si el typecheck
      # falla, el error se ve en este registro en vez de quedar enterrado.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build

      # --no-save: este paquete es solo para pedir el token, no es una dependencia
      # del sitio y no debe alterar package.json ni el lock.
      - name: Install OIDC Client from Core Package
        run: npm install --no-save @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_GLACIER_04A7C1510 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"          # Raíz del repositorio
          api_location: ""           # La API vive en su propio App Service
          output_location: "dist"    # Lo que produce vite build
          skip_app_build: true       # Ya se compiló en el paso anterior
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
